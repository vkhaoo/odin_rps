<!DOCTYPE html>

<html lang='en'>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Rock, Paper, Scissor</title>
        <script src="main.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="main">
            <div class="header">
                <div class="mainHead">
                    <p class="left-side">
                        Rock, Paper, Scissor
                    </p>
                    <p class="right-side">
                        Project for TOP
                    </p>
                </div>
            </div>
            <div class="ui">
                <div class="score">
                    <p id="score">Player:Computer</p>
                    <p class="results"></p>
                </div>
                <div class="buttons">
                    <button id="btn" class="rock">Rock</button>
                    <button id="btn" class="paper">Paper</button>
                    <button id="btn" class="scissors">Scissors</button>
                </div>
            </div>
            <div class="footer">
                <p class="center">
                    Project by Nicholas Ricchiuti
                </p>
            </div>
        </div>
    </body>
</html>
